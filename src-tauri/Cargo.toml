[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Already in Tauri's graph; used only for the AppKit non-activating overlay show.
objc2 = "0.6.5"

# Security backport: see ../vendor/glib-0.18.5/HEARTBEAT-PATCH.md.
[patch.crates-io]
glib = { path = "../vendor/glib-0.18.5" }
